name: integration-race

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wardguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/wardguard_test?sslmode=disable
      CGO_ENABLED: "1"
      JWT_SECRET: "ci-test-secret-do-not-use-in-prod-min-32-chars"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: integration suite with race detector
        run: go test -tags integration -race -count=1 -timeout 30m ./handlers/ -v
      - name: services integration suite with race detector
        run: go test -tags integration -race -count=1 -timeout 30m ./services/ -v
      - name: concurrency test x3
        run: go test -tags integration -race -count=3 -timeout 30m ./handlers/ -run TestFinancialLedgerConcurrentAppend -v
      - name: fuzz smoke (30s per target)
        run: |
          go test -run=^$ -fuzz=FuzzValidateToken -fuzztime=30s ./services/...
          go test -run=^$ -fuzz=FuzzSanitizeRequestID -fuzztime=30s ./middleware/...
          go test -run=^$ -fuzz=FuzzValidateDOB -fuzztime=30s ./handlers/...
          go test -run=^$ -fuzz=FuzzRemoveNonDigits -fuzztime=30s ./services/...
