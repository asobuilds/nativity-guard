services:
  # Backend Service
  - type: web
    name: nativityguard-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o main .
    startCommand: ./main
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: nativityguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nativityguard-frontend.onrender.com
      - key: MEDIA_ENDPOINT
        sync: false
      - key: MEDIA_REGION
        value: eu-west-2
      - key: MEDIA_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_BUCKET
        value: nativityguard-media
      - key: MEDIA_PUBLIC_BASE
        sync: false
    healthCheckPath: /health
    numInstances: 1
    plan: free

  # Frontend Service
  - type: web
    name: nativityguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nativityguard-backend.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_MEDIA_BASE
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nativityguard-db
    plan: free
    databaseName: nativityguard
    user: nativityguard